<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0057FF"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#FFFFFF"/>
  <!-- boxes -->
  <rect x="20" y="40" width="180" height="60" rx="10" fill="#F3F7FF" stroke="#0057FF" stroke-width="1.5"/>
  <text x="110" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">User in the browser</text>

  <rect x="290" y="40" width="180" height="60" rx="10" fill="#F3F7FF" stroke="#0057FF" stroke-width="1.5"/>
  <text x="380" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">OpenWebUI</text>

  <rect x="560" y="40" width="180" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="650" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Model on Nebius</text>

  <rect x="290" y="210" width="180" height="60" rx="10" fill="#EFFBFD" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="380" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Pyodide interpreter</text>
  <text x="380" y="254" text-anchor="middle" font-size="12" fill="#475569">in the browser</text>

  <!-- arrows -->
  <g stroke="#0057FF" stroke-width="1.5" fill="none">
    <line x1="200" y1="70" x2="286" y2="70" marker-end="url(#arr)"/>
    <line x1="470" y1="60" x2="556" y2="60" marker-end="url(#arr)"/>
    <line x1="560" y1="82" x2="474" y2="82" marker-end="url(#arr)"/>
    <line x1="365" y1="100" x2="365" y2="206" marker-end="url(#arr)"/>
    <line x1="395" y1="210" x2="395" y2="104" marker-end="url(#arr)"/>
    <polyline points="290,240 110,240 110,104" marker-end="url(#arr)"/>
  </g>

  <!-- labels -->
  <g font-size="11.5" fill="#475569">
    <text x="243" y="60" text-anchor="middle">request + file</text>
    <text x="515" y="50" text-anchor="middle">prompt + tools</text>
    <text x="515" y="99" text-anchor="middle">Python code</text>
    <text x="355" y="158" text-anchor="end">websocket</text>
    <text x="405" y="158" text-anchor="start">code result</text>
    <text x="200" y="232" text-anchor="middle">Excel file produced</text>
  </g>
</svg>
